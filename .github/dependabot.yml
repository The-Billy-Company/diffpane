version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Resolve editor packages together to preserve one copy of CodeMirror state and view.
      codemirror:
        patterns: ['@codemirror/*']
    ignore:
      # Upgrade Vite+ with its Vite alias, workspace override, and Vitest peer exceptions.
      - dependency-name: vite-plus
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: vite
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@voidzero-dev/vite-plus-core'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
