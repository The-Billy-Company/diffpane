name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VP_GIT_HOOKS: '0'
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Cache bundled HowMany
        uses: actions/cache@v6.1.0
        with:
          path: resources/howmany
          key: howmany-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/tooling/dependencies/howmany-tool.json', 'app/tooling/dependencies/setup-howmany.ts') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright install webkit
      - run: pnpm run setup:howmany
      - run: pnpm run verify
      - run: node app/tests/interface/assistant/agent-threads.integration.ts
      - name: Smoke test the macOS installer
        env:
          DIFFPANE_CODESIGN_IDENTITY: '-'
        run: |
          pnpm run install:app
          contents="$HOME/Applications/Diffpane.app/Contents"
          backend="$contents/Resources/backend"
          pty="$backend/node_modules/node-pty/prebuilds/darwin-$(uname -m)"
          test -f "$pty/pty.node"
          test -x "$pty/spawn-helper"
          test -f "$backend/node_modules/basedpyright/dist/pyright-langserver.js"
          test -f "$backend/node_modules/typescript/lib/typescript.js"
          test -f "$backend/node_modules/typescript-language-server/lib/cli.mjs"
          test "$(plutil -extract CFBundleDocumentTypes.0.LSHandlerRank raw -o - "$contents/Info.plist")" = Alternate
          "$backend/bin/node" --version
          "$backend/resources/howmany/howmany" --version
          "$HOME/.local/bin/dp" --version
          DIFFPANE_TEST_NODE="$backend/bin/node" node app/tests/interface/review/git.integration.ts
