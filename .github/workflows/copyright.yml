# Copyright (c) 2026 The Billy Company
name: Copyright headers

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  copyright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify header checker
        run: python3 app/tooling/copyright/test-check.py
      - name: Check source copyright headers
        run: python3 app/tooling/copyright/check.py --root .
