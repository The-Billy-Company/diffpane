[package]
name = "diffpane"
version = "1.0.0"
description = "A quiet, live view of your working tree"
edition = "2024"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
axum = "0.8"
base64 = "0.22"
libc = "0.2"
rfd = { version = "0.17.2", default-features = false }
rusty-leveldb = "4.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tauri = { version = "2.12.6", features = ["devtools", "unstable"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
trash = "5.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
security-framework = "3.7.0"
